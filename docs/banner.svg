<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PDF Check Maker</title>
  <desc id="desc">CSV and JSON data become PDF invoices through HTML templates. Python, WeasyPrint and Jinja2.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <circle cx="1110" cy="30" r="190" fill="#22d3ee" opacity=".06"/>
  <circle cx="1030" cy="330" r="210" fill="#38bdf8" opacity=".06"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="64" y="68" fill="#67e8f9" font-size="16" letter-spacing="3">DATA TO DOCUMENTS</text>
    <text x="60" y="142" fill="#f8fafc" font-size="58" font-weight="bold">PDF Check Maker</text>
    <text x="64" y="194" fill="#cbd5e1" font-size="25">CSV + JSON → HTML → PDF</text>
    <text x="64" y="264" fill="#a5f3fc" font-size="18">Python · WeasyPrint · Jinja2</text>
  </g>
  <g transform="translate(950 60)">
    <path d="M0 0 H110 L160 50 V200 H0 Z" fill="#f8fafc"/>
    <path d="M110 0 V50 H160" fill="#a5f3fc"/>
    <path d="M28 82 H130 M28 105 H130 M28 128 H95" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
    <rect x="24" y="153" width="112" height="32" rx="7" fill="#0e7490"/>
    <text x="80" y="176" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="white">PDF</text>
  </g>
</svg>
